name: Lint and Format

on:
  push:
    branches: [ 'main' ]
  pull_request:

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - parallel:
          - run: npm run lint
          - run: npm run format:check

